<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navegador Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        win: {
                            blue: '#0078d4',
                            lightBlue: '#e1f0fa',
                            link: '#1a0dab',
                            url: '#006621',
                        },
                    },
                },
            }
        }
    </script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-gray-50 select-none">
    <div class="w-full h-full flex flex-col glass">
        <!-- Barra de navegación -->
        <div class="flex gap-2 p-2 border-b flex-wrap items-center bg-white/80">
            <button class="px-2 py-1 text-xs bg-gray-100 rounded hover:bg-gray-200 transition-colors" id="btn-back">
                ←
            </button>
            <button class="px-2 py-1 text-xs bg-gray-100 rounded hover:bg-gray-200 transition-colors" id="btn-forward">
                →
            </button>
            <button class="px-2 py-1 text-xs bg-gray-100 rounded hover:bg-gray-200 transition-colors" id="btn-refresh">
                ↻
            </button>
            <input 
                type="text" 
                class="flex-1 min-w-[120px] px-2 py-1 border rounded text-sm bg-white/90 focus:border-win-blue" 
                value="" 
                id="browser-url"
                placeholder="Buscar o escribir dirección..."
            >
            <button onclick="buscar()" class="px-3 py-1 bg-win-blue text-white rounded text-sm hover:bg-win-blue/90 transition-colors">
                Ir
            </button>
        </div>

        <!-- Área de contenido -->
        <div id="browser-content" class="flex-1 p-4 overflow-auto bg-white">
        </div>
    </div>

    <script src="funciones.js"></script>
</body>
</html>
